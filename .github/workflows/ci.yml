name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: install dependencies
        run: bun install

      - name: build
        run: bun run build

      - name: run biome checks
        run: bun run check

      - name: run tests
        run: bun test

  # additional job only for pushes to main
  publish-check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          registry-url: "https://registry.npmjs.org"

      - name: install dependencies
        run: bun install

      - name: build
        run: bun run build

      - name: dry run publish
        run: bun publish --dry-run
        env:
          NPM_CONFIG_TOKEN: ${{secrets.NPM_TOKEN}}
